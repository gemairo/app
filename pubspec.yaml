name: gemairo
description: Krijg beter inzicht in je cijfers
publish_to: "none"

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.8+20000

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  pointycastle: ^3.6.2
  url_launcher: ^6.3.1
  dio: ^5.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.67.0
  dynamic_color: ^1.6.2
  background_fetch: ^1.1.5
  flutter_local_notifications: ^18.0.1
  webview_flutter: ^4.8.0
  fluttericon: ^2.0.0
  intl: ^0.19.0
  file_picker: ^8.1.7
  permission_handler: ^11.3.1
  collection: ^1.18.0
  carousel_slider: ^5.0.0
  provider: ^6.0.5
  flutter_staggered_grid_view: ^0.7.0
  # qr_flutter: ^4.0.0
  # mobile_scanner: ^3.2.0
  image_picker: ^1.1.2
  cross_file: ^0.3.3+4
  package_info_plus: ^8.1.2
  google_mobile_ads: ^5.2.0
  gma_mediation_applovin: ^1.2.0
  app_tracking_transparency: ^2.0.4
  cr_file_saver: ^0.0.2+1
  expandable_page_view: ^1.0.17
  firebase_core: ^3.9.0
  firebase_remote_config: ^5.2.0
  firebase_analytics: ^11.3.6
  firebase_messaging: ^15.1.6
  app_links: ^6.3.3
  desktop_webview_window: ^0.2.3
  in_app_review: ^2.0.8
  saaf:
    git:
      url: https://github.com/gemairo/gemairo.dart.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.3.3

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Gemairo
      fonts:
        - asset: assets/font_package/fonts/Gemairo.ttf
